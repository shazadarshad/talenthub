services:
  - type: web
    name: talenthub
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn run:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: talenthub-db
          property: connectionString

databases:
  - name: talenthub-db
    plan: free
